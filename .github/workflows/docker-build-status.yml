# -=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=
# .github/workflows/docker-build-status.yml
#
# Builds the n8n_status Docker image from main (same tagging scheme as the
# management image):
#
#   pull request  -> build only (nothing is pushed)
#   push to main  -> push :edge and :sha-<short>
#   tag vX.Y.Z    -> push :X.Y.Z, :X.Y, :sha-<short> and :latest
#
# Richard J. Sears
# richard@n8nmanagement.net
# -=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=

name: Build Status Collector Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
    paths:
      - 'n8n_status/**'
      - '.github/workflows/docker-build-status.yml'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'n8n_status/**'
      - '.github/workflows/docker-build-status.yml'

  workflow_dispatch:
    inputs:
      tag:
        description: 'Extra image tag (optional, "latest" is not allowed)'
        required: false
        default: ''
      platforms:
        description: 'Target platforms'
        required: false
        default: 'linux/amd64,linux/arm64'

env:
  REGISTRY: docker.io
  IMAGE_NAME: rjsears/n8n_status

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build-and-push:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      PUSH: ${{ github.event_name != 'pull_request' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=edge,branch=main
            type=sha,prefix=sha-,enable=${{ github.event_name != 'pull_request' }}
            type=ref,event=pr
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' && github.event.inputs.tag != 'latest' }}

      - name: Build (and push unless pull request)
        uses: docker/build-push-action@v5
        with:
          context: ./n8n_status
          file: ./n8n_status/Dockerfile
          push: ${{ env.PUSH == 'true' }}
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || github.event.inputs.platforms || 'linux/amd64,linux/arm64' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}

      - name: Summary
        run: |
          {
            echo "## Status image ${{ env.PUSH == 'true' && 'pushed' || 'built (not pushed)' }}"
            echo ""
            echo "**Image:** \`${{ env.IMAGE_NAME }}\`"
            echo ""
            echo "**Tags:**"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
