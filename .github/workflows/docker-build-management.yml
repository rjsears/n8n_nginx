# -=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=
# .github/workflows/docker-build-management.yml
#
# Builds the n8n_management Docker image.
#
#   pull request  -> test + build only (nothing is pushed)
#   push to main  -> test, then push :edge and :sha-<short>
#   tag vX.Y.Z    -> test, then push :X.Y.Z, :X.Y, :sha-<short> and :latest
#
# Installs pin rjsears/n8n_management:<X.Y.Z> (MGMT_VERSION in .env), so
# :latest only ever moves on a release tag and never on an untested commit.
#
# Richard J. Sears
# richard@n8nmanagement.net
# -=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=

name: Build Management Console Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
    paths:
      - 'management/**'
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docker-build-management.yml'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'management/**'
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docker-build-management.yml'
      - '.github/workflows/test.yml'

  # Manual trigger from the Actions tab (pushes :sha-<short> plus an
  # optional extra tag; never :latest)
  workflow_dispatch:
    inputs:
      tag:
        description: 'Extra image tag (optional, "latest" is not allowed)'
        required: false
        default: ''
      platforms:
        description: 'Target platforms'
        required: false
        default: 'linux/amd64,linux/arm64'

env:
  REGISTRY: docker.io
  IMAGE_NAME: rjsears/n8n_management

jobs:
  # =========================================
  # Tests must pass before anything is built
  # =========================================
  test:
    uses: ./.github/workflows/test.yml

  build-and-push:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      PUSH: ${{ github.event_name != 'pull_request' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # =========================================
      # Tags: semver + latest only on release tags,
      # edge on main, sha-<short> on every push
      # =========================================
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=edge,branch=main
            type=sha,prefix=sha-,enable=${{ github.event_name != 'pull_request' }}
            type=ref,event=pr
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' && github.event.inputs.tag != 'latest' }}

      - name: Build (and push unless pull request)
        uses: docker/build-push-action@v5
        with:
          context: ./management
          file: ./management/Dockerfile
          build-contexts: |
            docs_src=.
          push: ${{ env.PUSH == 'true' }}
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || github.event.inputs.platforms || 'linux/amd64,linux/arm64' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}

      - name: Summary
        run: |
          {
            echo "## Management image ${{ env.PUSH == 'true' && 'pushed' || 'built (not pushed)' }}"
            echo ""
            echo "**Image:** \`${{ env.IMAGE_NAME }}\`"
            echo ""
            echo "**Tags:**"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
