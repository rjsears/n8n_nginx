# -=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=
# .github/workflows/docker-build-management.yml
#
# Builds the n8n_management Docker image.
#
#   pull request  -> test + build only (nothing is pushed)
#   push to main  -> test, then push :latest, :edge and :sha-<short>
#   tag vX.Y.Z    -> test, then push :X.Y.Z, :X.Y, :latest and :sha-<short>
#                    (a V prefix, e.g. V3.0.1, works too)
#
# Installs follow rjsears/n8n_management:latest unless MGMT_VERSION in .env
# pins a release. Nothing is pushed unless the tests pass.
#
# Richard J. Sears
# richard@n8nmanagement.net
# -=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=

name: Build Management Console Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
      - 'V*.*.*'
    paths:
      - 'management/**'
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docker-build-management.yml'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'management/**'
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docker-build-management.yml'
      - '.github/workflows/test.yml'

  # Manual trigger from the Actions tab (pushes :sha-<short> plus an
  # optional extra tag; a run on main also moves :latest)
  workflow_dispatch:
    inputs:
      tag:
        description: 'Extra image tag (optional; a run on main also moves latest)'
        required: false
        default: ''
      platforms:
        description: 'Target platforms'
        required: false
        default: 'linux/amd64,linux/arm64'

env:
  REGISTRY: docker.io
  IMAGE_NAME: rjsears/n8n_management

jobs:
  # =========================================
  # Tests must pass before anything is built
  # =========================================
  test:
    uses: ./.github/workflows/test.yml

  build-and-push:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      PUSH: ${{ github.event_name != 'pull_request' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # =========================================
      # Tags: latest on main and release tags, semver
      # on release tags, edge on main, sha-<short> on
      # every push
      # =========================================
      # Release tags may be written vX.Y.Z or VX.Y.Z; strip the prefix so the
      # semver tags below parse either way.
      - name: Release version from tag
        id: version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME}"
          echo "version=${tag#[vV]}" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
            type=edge,branch=main
            type=sha,prefix=sha-,enable=${{ github.event_name != 'pull_request' }}
            type=ref,event=pr
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' && github.event.inputs.tag != 'latest' }}

      - name: Build (and push unless pull request)
        uses: docker/build-push-action@v5
        with:
          context: ./management
          file: ./management/Dockerfile
          build-contexts: |
            docs_src=.
          push: ${{ env.PUSH == 'true' }}
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || github.event.inputs.platforms || 'linux/amd64,linux/arm64' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}

      - name: Summary
        run: |
          {
            echo "## Management image ${{ env.PUSH == 'true' && 'pushed' || 'built (not pushed)' }}"
            echo ""
            echo "**Image:** \`${{ env.IMAGE_NAME }}\`"
            echo ""
            echo "**Tags:**"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
