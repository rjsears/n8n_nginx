# n8n Management Container - Internal Nginx Configuration
# Serves static Vue.js frontend and proxies API requests to Uvicorn

worker_processes auto;
error_log /app/logs/nginx_error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    # Same as "main" but with the path only ($uri, no query string), for
    # locations whose query strings must never reach a log file
    log_format pathonly '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                        '$status $body_bytes_sent "$http_user_agent" rt=$request_time';

    access_log /app/logs/nginx_access.log main;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               application/vnd.ms-fontobject application/x-font-ttf font/opentype
               image/svg+xml image/x-icon;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

    # Upstream for Uvicorn
    upstream uvicorn {
        server 127.0.0.1:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        root /app/static;
        index index.html;

        # Client address: this container is not published on the host; it is
        # reached through n8n_nginx, which always overwrites X-Real-IP with
        # the real client address. Take it from there (only from Docker's
        # private ranges, never from 127.0.0.1) so rate limiting below and the
        # API's allowed-subnet check see the client, not n8n_nginx. Every
        # location then re-sets X-Real-IP / X-Forwarded-For to that single
        # address, so a client-supplied X-Forwarded-For never reaches uvicorn.
        set_real_ip_from 10.0.0.0/8;
        set_real_ip_from 172.16.0.0/12;
        set_real_ip_from 192.168.0.0/16;
        real_ip_header X-Real-IP;

        # Security headers (additional headers added by main nginx).
        # nginx drops inherited add_header directives in any location that
        # declares its own, so locations below that add headers repeat these.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;

        # Content-Security-Policy for the console SPA (not /api/, whose
        # Swagger/ReDoc pages load their assets from a CDN). The Vite build
        # needs only same-origin module scripts; xterm and Vue inject
        # <style>/style attributes ('unsafe-inline' styles); backup previews
        # use data: images and downloads use blob: URLs; the terminal opens a
        # wss:// WebSocket to this host; File Browser is framed same-origin.
        set $console_csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss://$host; frame-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'";

        # Health check endpoint (no auth required)
        location /api/health {
            proxy_pass http://uvicorn;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            access_log off;
        }

        # Auth endpoints (stricter rate limiting)
        location /api/auth/login {
            limit_req zone=auth_limit burst=3 nodelay;

            proxy_pass http://uvicorn;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # Auth verify endpoint (used by nginx auth_request)
        location /api/auth/verify {
            proxy_pass http://uvicorn;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
        }

        # WebSocket terminal endpoint (no rate limiting, longer timeouts).
        # Authenticated by the session cookie, never by a URL parameter; the
        # access log still records the path only, so nothing in a query
        # string can end up on disk.
        location /api/ws/ {
            access_log /app/logs/nginx_access.log pathonly;

            proxy_pass http://uvicorn;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

            # WebSocket required headers
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Idle timeouts for terminal sessions. The console pings every
            # 30s, so an hour only ends abandoned connections; the API itself
            # closes the terminal when the login session ends.
            proxy_connect_timeout 60s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;

            # Disable buffering
            proxy_buffering off;
        }

        # API endpoints
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass http://uvicorn;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Port $http_x_forwarded_port;

            # WebSocket support for real-time updates
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeouts for long-running operations
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # Disable buffering for streaming
            proxy_buffering off;
        }

        # Backup downloads (larger files, longer timeouts)
        location /api/backups/download/ {
            proxy_pass http://uvicorn;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;

            # Disable buffering for streaming downloads
            proxy_buffering off;
            proxy_request_buffering off;

            # Longer timeout for large files
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # Static Vue.js frontend (SPA)
        location / {
            try_files $uri $uri/ /index.html;

            add_header Content-Security-Policy $console_csp always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "same-origin" always;

            # Cache static assets aggressively
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                add_header X-Content-Type-Options "nosniff" always;
                add_header Content-Security-Policy $console_csp always;
                access_log off;
            }

            # Don't cache HTML (for SPA updates)
            location ~* \.html$ {
                expires -1;
                add_header Cache-Control "no-store, no-cache, must-revalidate";
                add_header Content-Security-Policy $console_csp always;
                add_header X-Content-Type-Options "nosniff" always;
                add_header X-Frame-Options "SAMEORIGIN" always;
                add_header Referrer-Policy "same-origin" always;
            }
        }

        # Deny access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
